<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>カーテン一振りチャレンジ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #18181B;
      color: #F4F4F5;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overflow: hidden;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-tactile {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-tactile:hover {
      transform: translateY(-2px);
    }
    .btn-tactile:active {
      transform: translateY(1px) scale(0.97);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-pop-in {
      animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes pulseGrab {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .animate-grab-hint {
      animation: pulseGrab 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-2.5 sm:p-4 relative">

  <!-- トップHUDバー -->
  <header class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 z-20">
    <!-- タイトル＆サブタイトル -->
    <div class="flex items-center justify-between w-full sm:w-auto gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-zinc-950 flex items-center justify-center shadow-lg shadow-amber-500/20 font-black text-lg">
          🪟
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-white leading-tight">
            カーテン一振りチャレンジ
          </h1>
          <p class="text-[11px] text-zinc-400 font-medium">一発のストロークで <span class="text-amber-300 font-bold">100.0%</span> ピタッと閉めろ！</p>
        </div>
      </div>

      <!-- モバイル用ミュートボタン -->
      <button id="muteBtnMobile" aria-label="サウンド切替" class="sm:hidden btn-tactile w-9 h-9 rounded-xl bg-zinc-800/90 border border-zinc-700 flex items-center justify-center text-zinc-300">
        <span class="sound-icon-on">🔊</span>
        <span class="sound-icon-off hidden">🔇</span>
      </button>
    </div>

    <!-- モード切替 & サウンド -->
    <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
      <div class="bg-zinc-900/90 border border-zinc-800 p-1 rounded-xl flex text-xs font-bold flex-1 sm:flex-initial">
        <button id="modeChallengeBtn" class="flex-1 sm:flex-initial px-3 py-1.5 rounded-lg bg-amber-500 text-zinc-950 font-extrabold shadow-sm transition-all">
          5回チャレンジ
        </button>
        <button id="modeEndlessBtn" class="flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition-all">
          エンドレス練習
        </button>
      </div>

      <button id="muteBtnDesktop" aria-label="サウンド切替" class="hidden sm:flex btn-tactile w-9 h-9 rounded-xl bg-zinc-800/90 border border-zinc-700 items-center justify-center text-zinc-300 hover:text-white">
        <span class="sound-icon-on">🔊</span>
        <span class="sound-icon-off hidden">🔇</span>
      </button>
    </div>
  </header>

  <!-- ステータスゲージ（閉まり具合・ラウンド・ベスト） -->
  <section class="w-full max-w-4xl mx-auto grid grid-cols-3 gap-2 sm:gap-3 my-2 z-20">
    <!-- 現在の閉まり具合 -->
    <div class="bg-zinc-900/85 backdrop-blur-md border border-zinc-800 rounded-2xl px-3 py-2 flex flex-col items-center justify-center shadow-lg">
      <span class="text-[10px] sm:text-xs font-bold text-zinc-400">現在の閉まり具合</span>
      <div class="flex items-baseline gap-1">
        <span id="livePercentText" class="font-mono-num text-xl sm:text-2xl font-extrabold text-amber-400">12.0</span>
        <span class="text-xs font-bold text-zinc-500">%</span>
      </div>
    </div>

    <!-- ラウンド / スコア -->
    <div class="bg-zinc-900/85 backdrop-blur-md border border-zinc-800 rounded-2xl px-3 py-2 flex flex-col items-center justify-center shadow-lg">
      <span id="statCenterLabel" class="text-[10px] sm:text-xs font-bold text-zinc-400">ラウンド (合計点)</span>
      <div id="statCenterValue" class="font-mono-num text-base sm:text-xl font-extrabold text-white mt-0.5">
        1/5 <span class="text-xs sm:text-sm text-amber-400">(0pt)</span>
      </div>
    </div>

    <!-- ベスト記録 -->
    <div class="bg-zinc-900/85 backdrop-blur-md border border-zinc-800 rounded-2xl px-3 py-2 flex flex-col items-center justify-center shadow-lg">
      <span class="text-[10px] sm:text-xs font-bold text-zinc-400">ベスト記録</span>
      <div class="flex items-baseline gap-1">
        <span id="bestPercentText" class="font-mono-num text-xl sm:text-2xl font-extrabold text-emerald-400">--</span>
        <span class="text-xs font-bold text-zinc-500">%</span>
      </div>
    </div>
  </section>

  <!-- メインゲームキャンバス領域 -->
  <main class="relative flex-1 w-full max-w-4xl mx-auto rounded-3xl overflow-hidden border border-zinc-800 shadow-2xl bg-zinc-900">
    <canvas id="gameCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

    <!-- 操作ガイドピル -->
    <div id="guideBanner" class="pointer-events-none absolute bottom-4 left-1/2 -translate-x-1/2 bg-zinc-950/80 backdrop-blur-md border border-zinc-700/80 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-full shadow-xl flex items-center gap-2 whitespace-nowrap transition-opacity duration-300">
      <span class="text-amber-400 animate-grab-hint">👈</span>
      <span>左のカーテンを掴んで、右へ一振りで閉めよう！</span>
    </div>

    <!-- 一振り後のリザルトカード -->
    <div id="resultCard" class="hidden absolute inset-x-3 bottom-3 sm:inset-x-auto sm:right-5 sm:bottom-5 sm:w-96 bg-zinc-900/95 backdrop-blur-xl border border-zinc-700/90 rounded-3xl p-4 sm:p-5 shadow-2xl z-30 animate-pop-in">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span id="rankPill" class="px-2.5 py-0.5 rounded-full text-xs font-black bg-amber-500 text-zinc-950">
              RANK S
            </span>
            <span id="scoreGainText" class="font-mono-num text-xs font-bold text-amber-400">
              +100 pt
            </span>
          </div>
          <h2 id="resultHeadline" class="text-lg sm:text-xl font-black text-white mt-1">
            完全遮光！神業！！
          </h2>
        </div>

        <!-- ランク大文字バッジ -->
        <div id="rankLetterBox" class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-zinc-950 flex items-center justify-center font-mono-num text-2xl font-black shadow-lg shrink-0">
          S
        </div>
      </div>

      <!-- 数値詳細ボックス -->
      <div class="my-3 bg-zinc-950/80 border border-zinc-800 rounded-2xl p-3">
        <div class="flex items-baseline justify-between">
          <span class="text-xs font-bold text-zinc-400">最終到達率</span>
          <div class="font-mono-num text-2xl font-black text-white">
            <span id="finalClosePercent">99.8</span><span class="text-sm text-zinc-400 ml-0.5">%</span>
          </div>
        </div>
        <p id="resultDetailText" class="text-xs font-bold text-amber-300 mt-1.5 leading-relaxed">
          あと 0.2% 足りなかった！惜しすぎる！
        </p>
      </div>

      <!-- アクションボタン -->
      <button id="nextRoundBtn" class="btn-tactile w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-zinc-950 font-black text-sm shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
        <span id="nextRoundBtnLabel">次のカーテンへ</span>
        <span>→</span>
      </button>
    </div>

    <!-- 5回チャレンジ総合結果モーダル -->
    <div id="finalChallengeModal" class="hidden absolute inset-0 bg-zinc-950/75 backdrop-blur-md flex items-center justify-center p-4 z-40">
      <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl animate-pop-in">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 border border-amber-400/40 text-amber-300 flex items-center justify-center text-3xl mb-3">
          🏆
        </div>
        <p class="text-xs font-bold text-zinc-400 tracking-wider">5回チャレンジ 総合結果</p>
        <h2 id="overallTitle" class="text-xl font-black text-white mt-1">
          遮光マスター！
        </h2>

        <div class="my-4 bg-zinc-950/90 border border-zinc-800 rounded-2xl p-4">
          <div class="text-xs font-bold text-zinc-400">トータルスコア</div>
          <div class="font-mono-num text-3xl font-black text-amber-400 mt-0.5">
            <span id="overallScore">0</span> <span class="text-sm font-bold text-zinc-500">/ 500 pt</span>
          </div>
          <div class="mt-3 pt-3 border-t border-zinc-800 grid grid-cols-2 gap-2 text-xs">
            <div>
              <span class="text-zinc-500 block">最高到達率</span>
              <span id="overallBest" class="font-mono-num font-bold text-emerald-400 text-sm">0.0%</span>
            </div>
            <div>
              <span class="text-zinc-500 block">平均到達率</span>
              <span id="overallAvg" class="font-mono-num font-bold text-zinc-200 text-sm">0.0%</span>
            </div>
          </div>
        </div>

        <button id="restartAllBtn" class="btn-tactile w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black text-sm shadow-lg shadow-amber-500/25">
          もう一度 5回チャレンジする
        </button>
      </div>
    </div>
  </main>

  <script>
    /**
     * カーテン一振りチャレンジ (Curtain One-Stroke Challenge)
     * ------------------------------------------------------------------
     * 物理モデル：
     *  - カーテン先頭ランナー位置 x ∈ [minX, maxX]（閉まり率 p = 0% 〜 100%）
     *  - ドラッグ中は手（カーソル）に追従し、離した瞬間の初速度 v0 で慣性滑走
     *  - 滑走中はレール摩擦（動摩擦 + クーロン摩擦）と布の空気抵抗で減速
     *  - 100%（右端の壁・マグネットストッパー）に到達した際、速度が閾値以下なら
     *    マグネットに吸着して 100.0% ピタッと停止！
     *  - 閾値を超えるオーバースピードで激突すると「ガシャン！」と跳ね返り（反発係数 e）、
     *    逆方向へ戻って隙間が空いてしまうリアルな物理挙動を再現。
     */

    (() => {
      // ==========================================
      // 1. Web Audio API サウンドシンセサイザー
      // ==========================================
      class CurtainAudio {
        constructor() {
          this.ctx = null;
          this.muted = false;
          this.railNoiseNode = null;
          this.railGainNode = null;
          this.railFilterNode = null;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.setupContinuousRailSound();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        // カーテンランナーがレールを走る「シャーッ」という連続音を準備
        setupContinuousRailSound() {
          if (!this.ctx) return;
          const bufferSize = this.ctx.sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          // ランナーのコロコロ感を出すため微細な変調を加えたノイズ
          for (let i = 0; i < bufferSize; i++) {
            const mod = 0.75 + 0.25 * Math.sin(i * 0.045);
            data[i] = (Math.random() * 2 - 1) * mod;
          }

          this.railNoiseNode = this.ctx.createBufferSource();
          this.railNoiseNode.buffer = buffer;
          this.railNoiseNode.loop = true;

          this.railFilterNode = this.ctx.createBiquadFilter();
          this.railFilterNode.type = 'bandpass';
          this.railFilterNode.frequency.value = 1400;
          this.railFilterNode.Q.value = 1.8;

          this.railGainNode = this.ctx.createGain();
          this.railGainNode.gain.value = 0;

          this.railNoiseNode.connect(this.railFilterNode);
          this.railFilterNode.connect(this.railGainNode);
          this.railGainNode.connect(this.ctx.destination);
          this.railNoiseNode.start();
        }

        // 速度に応じて「シャーッ」音の音量とピッチ（周波数）をリアルタイム更新
        updateRailVelocity(speedNormalized) {
          if (!this.ctx || !this.railGainNode || !this.railFilterNode) return;
          const now = this.ctx.currentTime;
          if (this.muted || speedNormalized < 0.01) {
            this.railGainNode.gain.setTargetAtTime(0, now, 0.03);
            return;
          }
          const clamped = Math.min(1.5, speedNormalized);
          const targetGain = Math.min(0.28, clamped * 0.22);
          const targetFreq = 900 + clamped * 1600;
          this.railGainNode.gain.setTargetAtTime(targetGain, now, 0.025);
          this.railFilterNode.frequency.setTargetAtTime(targetFreq, now, 0.03);
        }

        toggleMute() {
          this.muted = !this.muted;
          if (this.muted) {
            this.updateRailVelocity(0);
          }
          return this.muted;
        }

        // カーテンを掴んだときの布擦れ音
        playGrab() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(280, now + 0.06);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.075);
        }

        // 壁に激突して跳ね返ったときの「ガシャン！」音
        playWallCrash(impactStrength) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const vol = Math.min(0.45, 0.15 + impactStrength * 0.25);

          // 1. 低音の衝撃音
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.18);

          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.21);

          // 2. 金属レールの「ガシャン」ノイズ
          const bufLen = Math.floor(this.ctx.sampleRate * 0.14);
          const buf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < bufLen; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.25));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buf;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 2400;

          const nGain = this.ctx.createGain();
          nGain.gain.setValueAtTime(vol * 0.9, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          noise.connect(filter);
          filter.connect(nGain);
          nGain.connect(this.ctx.destination);
          noise.start(now);
        }

        // 100%マグネットに「カチッ」と吸着した音
        playMagnetSnap() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.05);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }

        // 結果ファンファーレ
        playResultRank(rank) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          let notes = [];
          if (rank === 'S') {
            notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          } else if (rank === 'A') {
            notes = [523.25, 659.25, 783.99, 1046.50];
          } else if (rank === 'B') {
            notes = [440, 554.37, 659.25];
          } else if (rank === 'C') {
            notes = [392.0, 440.0];
          } else {
            notes = [311.13, 261.63];
          }

          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = (rank === 'S' || rank === 'A') ? 'sine' : 'triangle';
            const t = now + 0.05 + idx * 0.075;
            osc.frequency.setValueAtTime(freq, t);

            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.15, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.4);
          });
        }
      }

      const audio = new CurtainAudio();

      // ==========================================
      // 2. ゲーム状態と物理パラメータ
      // ==========================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // カーテンの生地テーマ（ラウンドごとに少し変化して飽きさせない）
      const CURTAIN_THEMES = [
        { name: 'ロイヤルネイビー', base: '#1E3A5F', shadow: '#10233C', highlight: '#335C8E', trim: '#D97706' },
        { name: 'ボルドーベルベット', base: '#6B1D2F', shadow: '#420E1B', highlight: '#96324A', trim: '#F59E0B' },
        { name: 'フォレストグリーン', base: '#1F4E3D', shadow: '#112E24', highlight: '#33755D', trim: '#EAB308' },
        { name: 'チャコールモダン', base: '#334155', shadow: '#1E293B', highlight: '#475569', trim: '#38BDF8' },
        { name: 'テラコッタリネン', base: '#8C3B2B', shadow: '#592116', highlight: '#B55440', trim: '#FDE047' }
      ];

      const state = {
        mode: 'challenge', // 'challenge' (5回) | 'endless'
        round: 1,
        maxRounds: 5,
        totalScore: 0,
        historyPercents: [],
        bestPercent: null,

        // ゲーム進行フェーズ: 'ready' (掴み待ち) | 'dragging' (掴んで移動中) | 'gliding' (手を離して滑走中) | 'settled' (停止・結果表示) | 'finished' (5回終了)
        phase: 'ready',

        // 物理状態（0.0 = 完全に開いた初期位置, 1.0 = 100%完全閉鎖）
        // 初期状態は 12% ほど束ねられた状態からスタート
        initialOpenRatio: 0.12,
        progress: 0.12,        // 現在の閉まり率 (0.12 〜 1.00)
        velocity: 0,           // 閉まり率の速度 (ratio / sec)
        maxReached: 0.12,      // 今回のストロークで到達した最大閉まり率
        didBounce: false,      // 壁に激突して跳ね返ったか
        bounceCount: 0,

        // 布の揺れ物理（二次遅れ系バネダンパモデル）
        hemSway: 0,            // 裾の遅れ角度・変位
        hemSwayVel: 0,         // 裾の揺れ速度

        // ドラッグ入力計測
        dragOffsetX: 0,
        pointerHistory: [],    // 直近のポインター位置と時刻（リリース速度算出用）

        // 視覚エフェクト
        sparkles: [],
        wallImpactFlash: 0,    // 壁激突時のフラッシュ強度
        theme: CURTAIN_THEMES[0],
        lastTime: 0
      };

      // UI参照
      const ui = {
        livePercentText: document.getElementById('livePercentText'),
        statCenterLabel: document.getElementById('statCenterLabel'),
        statCenterValue: document.getElementById('statCenterValue'),
        bestPercentText: document.getElementById('bestPercentText'),

        modeChallengeBtn: document.getElementById('modeChallengeBtn'),
        modeEndlessBtn: document.getElementById('modeEndlessBtn'),
        muteBtnMobile: document.getElementById('muteBtnMobile'),
        muteBtnDesktop: document.getElementById('muteBtnDesktop'),

        guideBanner: document.getElementById('guideBanner'),
        resultCard: document.getElementById('resultCard'),
        rankPill: document.getElementById('rankPill'),
        scoreGainText: document.getElementById('scoreGainText'),
        resultHeadline: document.getElementById('resultHeadline'),
        rankLetterBox: document.getElementById('rankLetterBox'),
        finalClosePercent: document.getElementById('finalClosePercent'),
        resultDetailText: document.getElementById('resultDetailText'),
        nextRoundBtn: document.getElementById('nextRoundBtn'),
        nextRoundBtnLabel: document.getElementById('nextRoundBtnLabel'),

        finalChallengeModal: document.getElementById('finalChallengeModal'),
        overallTitle: document.getElementById('overallTitle'),
        overallScore: document.getElementById('overallScore'),
        overallBest: document.getElementById('overallBest'),
        overallAvg: document.getElementById('overallAvg'),
        restartAllBtn: document.getElementById('restartAllBtn')
      };

      // 論理キャンバスサイズとレイアウト計算
      let W = 800;
      let H = 500;

      function getWindowLayout() {
        const padX = Math.max(24, W * 0.07);
        const topY = Math.max(46, H * 0.11);
        const bottomY = H - Math.max(28, H * 0.07);
        const winLeft = padX;
        const winRight = W - padX;
        const winW = winRight - winLeft;
        const winH = bottomY - topY;
        const railY = topY - 14;

        // 0%位置（左端）と 100%位置（右端ストッパー）
        const startX = winLeft + 8;
        const endX = winRight - 8;

        return { winLeft, winRight, winW, winH, topY, bottomY, railY, startX, endX };
      }

      function progressToX(prog) {
        const { startX, endX } = getWindowLayout();
        return startX + (endX - startX) * prog;
      }

      function xToProgress(x) {
        const { startX, endX } = getWindowLayout();
        return (x - startX) / (endX - startX);
      }

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width;
        H = rect.height;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resizeCanvas);

      // ==========================================
      // 3. ゲーム進行・判定ロジック
      // ==========================================
      function updateTopHUD() {
        const pct = (state.progress * 100).toFixed(1);
        ui.livePercentText.textContent = pct;

        // 100%に近づくほど文字色を強調
        if (state.progress >= 0.995) {
          ui.livePercentText.className = 'font-mono-num text-xl sm:text-2xl font-extrabold text-emerald-400';
        } else if (state.progress >= 0.95) {
          ui.livePercentText.className = 'font-mono-num text-xl sm:text-2xl font-extrabold text-amber-300';
        } else {
          ui.livePercentText.className = 'font-mono-num text-xl sm:text-2xl font-extrabold text-amber-400';
        }

        if (state.mode === 'challenge') {
          ui.statCenterLabel.textContent = 'ラウンド (合計点)';
          ui.statCenterValue.innerHTML = `${state.round}/${state.maxRounds} <span class="text-xs sm:text-sm text-amber-400">(${state.totalScore}pt)</span>`;
        } else {
          ui.statCenterLabel.textContent = 'トライ回数';
          ui.statCenterValue.innerHTML = `${state.round} <span class="text-xs font-bold text-zinc-400">回目</span>`;
        }

        if (state.bestPercent !== null) {
          ui.bestPercentText.textContent = state.bestPercent.toFixed(1);
        } else {
          ui.bestPercentText.textContent = '--';
        }
      }

      function resetRound(fullReset = false) {
        if (fullReset) {
          state.round = 1;
          state.totalScore = 0;
          state.historyPercents = [];
        }

        state.phase = 'ready';
        state.progress = state.initialOpenRatio;
        state.velocity = 0;
        state.maxReached = state.initialOpenRatio;
        state.didBounce = false;
        state.bounceCount = 0;
        state.hemSway = 0;
        state.hemSwayVel = 0;
        state.sparkles = [];
        state.wallImpactFlash = 0;
        state.theme = CURTAIN_THEMES[(state.round - 1) % CURTAIN_THEMES.length];

        ui.resultCard.classList.add('hidden');
        ui.finalChallengeModal.classList.add('hidden');
        ui.guideBanner.style.opacity = '1';
        audio.updateRailVelocity(0);
        updateTopHUD();
      }

      function spawnVictorySparkles(count = 65) {
        const { winLeft, winW, topY, winH } = getWindowLayout();
        const colors = ['#FDE047', '#F59E0B', '#34D399', '#FFFFFF', '#FBBF24'];
        for (let i = 0; i < count; i++) {
          state.sparkles.push({
            x: winLeft + Math.random() * winW,
            y: topY + Math.random() * winH,
            vx: (Math.random() - 0.5) * 60,
            vy: -20 - Math.random() * 50,
            size: 2 + Math.random() * 4.5,
            alpha: 1,
            decay: 0.4 + Math.random() * 0.5,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      function evaluateStrokeResult() {
        state.phase = 'settled';
        audio.updateRailVelocity(0);

        const finalPct = Math.round(state.progress * 1000) / 10; // 小数第1位 (0.0 〜 100.0)
        const maxPct = Math.round(state.maxReached * 1000) / 10;
        const gapPct = Math.max(0, Math.round((100 - finalPct) * 10) / 10);

        // スコア計算（100点満点）
        // 100.0%〜99.5%で100点、離れるほど減点
        let score = 0;
        if (finalPct >= 99.5) {
          score = 100;
        } else if (finalPct >= 98.0) {
          score = Math.round(92 + (finalPct - 98.0) * 5); // 92〜99
        } else if (finalPct >= 94.0) {
          score = Math.round(75 + (finalPct - 94.0) * 4); // 75〜91
        } else if (finalPct >= 85.0) {
          score = Math.round(45 + (finalPct - 85.0) * 3.3); // 45〜74
        } else {
          score = Math.max(5, Math.round(finalPct * 0.5));
        }

        // ランク・タイトル・詳細メッセージ決定
        let rank = 'D';
        let headline = '';
        let detail = '';
        let pillStyle = '';
        let boxStyle = '';

        if (finalPct >= 99.5) {
          rank = 'S';
          headline = finalPct === 100.0 ? '完全遮光 100.0%！！神業！' : 'ほぼ完全遮光！職人技！';
          pillStyle = 'bg-amber-400 text-zinc-950';
          boxStyle = 'from-amber-300 via-yellow-400 to-orange-500 text-zinc-950';
          spawnVictorySparkles(85);
        } else if (finalPct >= 97.5) {
          rank = 'A';
          headline = '超惜しい！あと指一本分！';
          pillStyle = 'bg-emerald-400 text-zinc-950';
          boxStyle = 'from-emerald-400 to-teal-500 text-zinc-950';
          spawnVictorySparkles(35);
        } else if (finalPct >= 92.0) {
          rank = 'B';
          headline = 'ナイスストローク！';
          pillStyle = 'bg-sky-400 text-zinc-950';
          boxStyle = 'from-sky-400 to-blue-500 text-zinc-950';
        } else if (finalPct >= 80.0) {
          rank = 'C';
          headline = 'まずまずの閉まり具合';
          pillStyle = 'from-zinc-500 to-zinc-600 text-white';
          pillStyle = 'bg-zinc-600 text-white';
        } else {
          rank = 'D';
          headline = 'まだまだ眩しい…！';
          pillStyle = 'bg-rose-500 text-white';
          boxStyle = 'from-rose-500 to-red-600 text-white';
        }

        // フィードバック文章（跳ね返ったか、足りなかったか）
        if (state.didBounce) {
          if (finalPct >= 99.5) {
            detail = `壁にタッチしつつ奇跡のピタ止め！（最終 ${finalPct.toFixed(1)}%）`;
          } else {
            detail = `勢い余って壁に激突し跳ね返った！（最大 ${maxPct.toFixed(1)}% → 跳ね返り後 ${finalPct.toFixed(1)}%）`;
          }
        } else {
          if (finalPct === 100.0) {
            detail = '1ミリも光を漏らさない完璧な力加減！';
          } else {
            detail = `あと ${gapPct.toFixed(1)}% 足りなかった！もう少しだけ強く引こう！`;
          }
        }

        // 記録更新
        state.totalScore += score;
        state.historyPercents.push(finalPct);
        if (state.bestPercent === null || finalPct > state.bestPercent) {
          state.bestPercent = finalPct;
        }
        updateTopHUD();

        audio.playResultRank(rank);

        // リザルトカード反映
        ui.rankPill.textContent = `RANK ${rank}`;
        ui.rankPill.className = `px-2.5 py-0.5 rounded-full text-xs font-black ${pillStyle}`;
        ui.scoreGainText.textContent = state.mode === 'challenge' ? `+${score} pt` : `${score}点相当`;
        ui.resultHeadline.textContent = headline;
        ui.rankLetterBox.textContent = rank;
        ui.rankLetterBox.className = `w-12 h-12 rounded-2xl bg-gradient-to-br ${boxStyle} flex items-center justify-center font-mono-num text-2xl font-black shadow-lg shrink-0`;

        ui.finalClosePercent.textContent = finalPct.toFixed(1);
        ui.resultDetailText.textContent = detail;

        if (state.mode === 'challenge' && state.round >= state.maxRounds) {
          ui.nextRoundBtnLabel.textContent = '5回の総合結果を見る';
        } else {
          ui.nextRoundBtnLabel.textContent = '次のカーテンへ';
        }

        ui.resultCard.classList.remove('hidden');
      }

      function showOverallChallengeResult() {
        state.phase = 'finished';
        ui.resultCard.classList.add('hidden');

        const best = Math.max(...state.historyPercents);
        const avg = state.historyPercents.reduce((a, b) => a + b, 0) / state.historyPercents.length;

        let title = 'カーテン見習い';
        if (state.totalScore >= 485) {
          title = '伝説の完全遮光マスター！！';
          spawnVictorySparkles(120);
        } else if (state.totalScore >= 430) {
          title = 'プロ級のカーテン職人！';
          spawnVictorySparkles(70);
        } else if (state.totalScore >= 350) {
          title = 'かなりの力加減センス！';
        } else if (state.totalScore >= 250) {
          title = 'あと一歩で達人！';
        }

        ui.overallTitle.textContent = title;
        ui.overallScore.textContent = state.totalScore;
        ui.overallBest.textContent = `${best.toFixed(1)}%`;
        ui.overallAvg.textContent = `${avg.toFixed(1)}%`;
        ui.finalChallengeModal.classList.remove('hidden');
      }

      // ==========================================
      // 4. ポインター（マウス・タッチ）操作
      // ==========================================
      function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function onPointerDown(e) {
        // 一度掴んで離したら追加操作不可（phase === 'ready' のときだけ掴める）
        if (state.phase !== 'ready') return;
        e.preventDefault();
        audio.init();

        const pos = getPointerPos(e);
        const { winLeft, topY, bottomY } = getWindowLayout();
        const edgeX = progressToX(state.progress);

        // カーテン本体または先頭ハンドル付近をタップしたか判定（遊びやすさのため広めに判定）
        if (pos.x >= winLeft - 20 && pos.x <= edgeX + 55 && pos.y >= topY - 25 && pos.y <= bottomY + 25) {
          state.phase = 'dragging';
          state.dragOffsetX = pos.x - edgeX;
          state.pointerHistory = [{ x: pos.x, t: performance.now() }];
          ui.guideBanner.style.opacity = '0';
          audio.playGrab();
        }
      }

      function onPointerMove(e) {
        if (state.phase !== 'dragging') return;
        e.preventDefault();

        const pos = getPointerPos(e);
        const now = performance.now();

        // ドラッグ中はカーテン先頭を手に追従させる（最大94%までにして、最後は必ず慣性で滑らせる）
        const targetEdgeX = pos.x - state.dragOffsetX;
        const rawProg = xToProgress(targetEdgeX);
        const clampedProg = Math.max(state.initialOpenRatio, Math.min(0.94, rawProg));

        const prevProg = state.progress;
        state.progress = clampedProg;
        state.maxReached = Math.max(state.maxReached, state.progress);

        // 履歴を保持（直近90msの移動量からリリース初速度を正確に計算）
        state.pointerHistory.push({ x: pos.x, t: now });
        while (state.pointerHistory.length > 2 && now - state.pointerHistory[0].t > 90) {
          state.pointerHistory.shift();
        }

        // ドラッグ速度に応じた裾の揺れとレール音
        const instantVel = (state.progress - prevProg) * 60;
        state.hemSway = Math.max(-0.45, Math.min(0.45, -instantVel * 0.14));
        audio.updateRailVelocity(Math.abs(instantVel));
        updateTopHUD();
      }

      function onPointerUp(e) {
        if (state.phase !== 'dragging') return;
        e.preventDefault();

        const now = performance.now();
        // 直近のポインター移動履歴からリリース速度（px/sec -> ratio/sec）を算出
        let releaseVelRatio = 0;
        if (state.pointerHistory.length >= 2) {
          const oldest = state.pointerHistory[0];
          const newest = state.pointerHistory[state.pointerHistory.length - 1];
          const dtSec = Math.max(0.012, (now - oldest.t) / 1000);
          const dx = newest.x - oldest.x;
          const { startX, endX } = getWindowLayout();
          const trackLen = Math.max(100, endX - startX);
          releaseVelRatio = (dx / trackLen) / dtSec;
        }

        // ほとんど動かさずに離した場合はやり直し可能に戻す
        if (state.progress <= state.initialOpenRatio + 0.02 && releaseVelRatio < 0.15) {
          state.phase = 'ready';
          state.progress = state.initialOpenRatio;
          ui.guideBanner.style.opacity = '1';
          audio.updateRailVelocity(0);
          updateTopHUD();
          return;
        }

        // 一振り確定！慣性滑走フェーズへ移行（ここからは追加操作不可）
        state.phase = 'gliding';
        // 初速度に気持ちよいブースト係数を掛けつつ上限を設定
        state.velocity = Math.max(0.05, Math.min(4.8, releaseVelRatio * 1.18));
      }

      canvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      canvas.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp, { passive: false });

      // ==========================================
      // 5. 物理シミュレーション更新ループ
      // ==========================================
      function updatePhysics(dt) {
        // 裾の揺れ（バネ・ダンパ系で布の重みと慣性を表現）
        const springK = 38.0;
        const damping = 5.2;
        const targetSway = state.phase === 'gliding' ? -state.velocity * 0.16 : 0;
        const swayForce = (targetSway - state.hemSway) * springK - state.hemSwayVel * damping;
        state.hemSwayVel += swayForce * dt;
        state.hemSway += state.hemSwayVel * dt;

        // キラキラパーティクル更新
        for (let i = state.sparkles.length - 1; i >= 0; i--) {
          const s = state.sparkles[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.alpha -= s.decay * dt;
          if (s.alpha <= 0) state.sparkles.splice(i, 1);
        }

        // 壁激突フラッシュ減衰
        if (state.wallImpactFlash > 0) {
          state.wallImpactFlash = Math.max(0, state.wallImpactFlash - dt * 3.5);
        }

        if (state.phase !== 'gliding') return;

        // レール摩擦と空気抵抗のモデル
        // 高速時は空気抵抗が大きく、低速時はレールの転がり摩擦で「シャーッ…スッ」と止まる
        const airDrag = 1.65;      // 速度比例の減衰係数
        const railFriction = 0.24; // 一定の動摩擦力

        const dir = Math.sign(state.velocity);
        const speed = Math.abs(state.velocity);

        const decel = speed * airDrag + railFriction;
        const nextSpeed = Math.max(0, speed - decel * dt);
        state.velocity = dir * nextSpeed;

        state.progress += state.velocity * dt;
        if (state.progress > state.maxReached) {
          state.maxReached = state.progress;
        }

        // 100%（右端の壁・マグネットストッパー）との衝突・吸着判定
        if (state.progress >= 1.0) {
          state.progress = 1.0;
          state.maxReached = 1.0;

          const impactSpeed = state.velocity;
          // 速度が「マグネット吸着許容範囲（0.52以下）」ならピタッと100.0%で止まる！
          if (impactSpeed <= 0.52) {
            state.velocity = 0;
            state.hemSwayVel += impactSpeed * 2.8; // ピタッと止まった反動で裾が前に揺れる
            audio.playMagnetSnap();
            updateTopHUD();
            evaluateStrokeResult();
            return;
          } else {
            // 勢いが強すぎて「ガシャン！」と壁に激突して跳ね返る！
            state.didBounce = true;
            state.bounceCount += 1;
            // 反発係数（初回はしっかり跳ね返り、2回目以降は減衰）
            const restitution = 0.44;
            state.velocity = -impactSpeed * restitution;
            state.hemSwayVel += impactSpeed * 4.5; // 激突の衝撃で裾が大きく暴れる
            state.wallImpactFlash = Math.min(1, impactSpeed * 0.45);
            audio.playWallCrash(impactSpeed);
          }
        }

        // 左端ストッパー保護
        if (state.progress < state.initialOpenRatio) {
          state.progress = state.initialOpenRatio;
          state.velocity = Math.abs(state.velocity) * 0.3;
        }

        // 走行音更新 & HUD更新
        audio.updateRailVelocity(Math.abs(state.velocity));
        updateTopHUD();

        // 完全に静止したかチェック
        if (Math.abs(state.velocity) < 0.004) {
          state.velocity = 0;
          evaluateStrokeResult();
        }
      }

      // ==========================================
      // 6. 2D Canvas 描画（窓・光・ドレープカーテン）
      // ==========================================
      function renderScene() {
        ctx.clearRect(0, 0, W, H);
        const layout = getWindowLayout();
        const { winLeft, winRight, winW, winH, topY, bottomY, railY } = layout;
        const curtainEdgeX = progressToX(state.progress);

        // 閉まり率に応じた部屋の明るさ係数 (0.0 = 眩しい朝、1.0 = 完全遮光の暗い部屋)
        const darkness = Math.pow(Math.max(0, Math.min(1, (state.progress - 0.1) / 0.9)), 1.35);

        // ------------------------------------------
        // A. 部屋の壁紙背景（閉まるほど暗く落ち着く）
        // ------------------------------------------
        const wallGrad = ctx.createLinearGradient(0, 0, 0, H);
        const rTop = Math.round(58 - darkness * 38);
        const gTop = Math.round(55 - darkness * 36);
        const bTop = Math.round(52 - darkness * 32);
        wallGrad.addColorStop(0, `rgb(${rTop}, ${gTop}, ${bTop})`);
        wallGrad.addColorStop(1, `rgb(${Math.max(12, rTop - 12)}, ${Math.max(12, gTop - 12)}, ${Math.max(14, bTop - 10)})`);
        ctx.fillStyle = wallGrad;
        ctx.fillRect(0, 0, W, H);

        // ------------------------------------------
        // B. 窓の外の風景（爽やかな朝空・太陽・雲・街並み）
        // ------------------------------------------
        ctx.save();
        ctx.beginPath();
        ctx.rect(winLeft, topY, winW, winH);
        ctx.clip();

        // 朝焼け〜青空のグラデーション
        const skyGrad = ctx.createLinearGradient(0, topY, 0, bottomY);
        skyGrad.addColorStop(0, '#38BDF8');
        skyGrad.addColorStop(0.55, '#BAE6FD');
        skyGrad.addColorStop(1, '#FEF3C7');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(winLeft, topY, winW, winH);

        // 眩しい太陽（右寄りに配置し、最後まで閉めないと光が差し込む演出に）
        const sunX = winLeft + winW * 0.78;
        const sunY = topY + winH * 0.28;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, winW * 0.45);
        sunGlow.addColorStop(0, 'rgba(255, 253, 230, 1)');
        sunGlow.addColorStop(0.15, 'rgba(253, 224, 71, 0.85)');
        sunGlow.addColorStop(0.45, 'rgba(253, 186, 116, 0.28)');
        sunGlow.addColorStop(1, 'rgba(253, 186, 116, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(winLeft, topY, winW, winH);

        // 太陽コア
        ctx.fillStyle = '#FFFBEB';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 22, 0, Math.PI * 2);
        ctx.fill();

        // 遠くの山と街のシルエット
        ctx.fillStyle = '#7DD3FC';
        ctx.beginPath();
        ctx.moveTo(winLeft, bottomY);
        ctx.lineTo(winLeft, topY + winH * 0.74);
        ctx.quadraticCurveTo(winLeft + winW * 0.28, topY + winH * 0.62, winLeft + winW * 0.55, topY + winH * 0.75);
        ctx.quadraticCurveTo(winLeft + winW * 0.8, topY + winH * 0.65, winRight, topY + winH * 0.72);
        ctx.lineTo(winRight, bottomY);
        ctx.closePath();
        ctx.fill();

        // 窓のサッシ（中央の縦桟と横桟）
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(winLeft + winW * 0.5, topY);
        ctx.lineTo(winLeft + winW * 0.5, bottomY);
        ctx.moveTo(winLeft, topY + winH * 0.52);
        ctx.lineTo(winRight, topY + winH * 0.52);
        ctx.stroke();

        ctx.restore();

        // ------------------------------------------
        // C. 隙間から床へ差し込む光条（ゴッドレイ）
        // ------------------------------------------
        const openGapW = Math.max(0, winRight - curtainEdgeX);
        if (openGapW > 1) {
          ctx.save();
          const rayGrad = ctx.createLinearGradient(curtainEdgeX, topY, curtainEdgeX + openGapW * 0.4, H);
          const rayAlpha = Math.min(0.32, 0.08 + (openGapW / winW) * 0.28);
          rayGrad.addColorStop(0, `rgba(254, 249, 195, ${rayAlpha})`);
          rayGrad.addColorStop(1, 'rgba(254, 249, 195, 0)');

          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(curtainEdgeX, topY);
          ctx.lineTo(winRight, topY);
          ctx.lineTo(winRight + 40, H);
          ctx.lineTo(Math.max(winLeft, curtainEdgeX - 35), H);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // ------------------------------------------
        // D. 窓枠フレーム（木目調ダークフレーム）
        // ------------------------------------------
        ctx.strokeStyle = '#27272A';
        ctx.lineWidth = 10;
        ctx.strokeRect(winLeft - 3, topY - 3, winW + 6, winH + 6);

        // 右端の100%ターゲットライン（マグネットキャッチ位置の視覚ガイド）
        const targetX = progressToX(1.0);
        ctx.save();
        ctx.strokeStyle = state.progress >= 0.995 ? '#10B981' : 'rgba(251, 191, 36, 0.75)';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(targetX, railY - 4);
        ctx.lineTo(targetX, bottomY + 6);
        ctx.stroke();
        ctx.setLineDash([]);

        // 右壁のマグネットストッパー金具
        ctx.fillStyle = state.wallImpactFlash > 0 ? '#F43F5E' : '#F59E0B';
        ctx.fillRect(targetX - 2, railY - 6, 6, 12);
        ctx.restore();

        // ------------------------------------------
        // E. ドレープカーテン本体（ヒダ・陰影・裾の揺れ）
        // ------------------------------------------
        drawDrapedCurtain(layout, curtainEdgeX);

        // ------------------------------------------
        // F. カーテンレール & ランナー（滑車）
        // ------------------------------------------
        drawCurtainRailAndRunners(layout, curtainEdgeX);

        // ------------------------------------------
        // G. 壁激突フラッシュ & 勝利キラキラパーティクル
        // ------------------------------------------
        if (state.wallImpactFlash > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(244, 63, 94, ${state.wallImpactFlash * 0.28})`;
          ctx.fillRect(targetX - 24, topY, 32, winH);
          ctx.restore();
        }

        state.sparkles.forEach(s => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, s.alpha);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // ------------------------------------------
        // H. 操作待ち中の掴みハンドルマーカー（カーテンの先頭）
        // ------------------------------------------
        if (state.phase === 'ready' || state.phase === 'dragging') {
          const handleY = topY + winH * 0.48;
          ctx.save();
          // 外側のパルスリング
          const pulse = state.phase === 'ready' ? (1 + Math.sin(performance.now() * 0.006) * 0.15) : 1.15;
          ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
          ctx.beginPath();
          ctx.arc(curtainEdgeX, handleY, 22 * pulse, 0, Math.PI * 2);
          ctx.fill();

          // ハンドル本体
          ctx.fillStyle = '#F59E0B';
          ctx.strokeStyle = '#FFFBEB';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(curtainEdgeX, handleY, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 左右矢印アイコン
          ctx.fillStyle = '#18181B';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('⇄', curtainEdgeX, handleY + 0.5);
          ctx.restore();
        }
      }

      /**
       * 伸縮するプリーツ（ヒダ）と裾の揺れを持つリアルなカーテンを描画
       */
      function drawDrapedCurtain(layout, edgeX) {
        const { winLeft, topY, bottomY, railY } = layout;
        const curtainLeft = winLeft - 6;
        const curtainTop = railY + 7;
        const curtainBottom = bottomY + 10;
        const curtainH = curtainBottom - curtainTop;
        const currentSpan = Math.max(24, edgeX - curtainLeft);

        // ヒダ（プリーツ）の数。閉まるほどヒダが伸びて幅が広がる
        const numPleats = 12;
        const pleatW = currentSpan / numPleats;
        const theme = state.theme;

        ctx.save();

        // 窓ガラスに落ちるカーテンの影
        ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
        ctx.fillRect(curtainLeft, curtainTop, currentSpan + 6, curtainH);

        // 各ヒダを1列ずつ立体グラデーションで描画
        for (let i = 0; i < numPleats; i++) {
          const ratio0 = i / numPleats;
          const ratio1 = (i + 1) / numPleats;

          // 先頭（右端）に近いヒダほど大きく揺れる
          const swayFactor0 = Math.pow(ratio0, 1.4) * state.hemSway * 55;
          const swayFactor1 = Math.pow(ratio1, 1.4) * state.hemSway * 55;

          const topX0 = curtainLeft + i * pleatW;
          const topX1 = curtainLeft + (i + 1) * pleatW;
          const botX0 = topX0 + swayFactor0;
          const botX1 = topX1 + swayFactor1;

          // 3D円筒状の陰影グラデーション（山と谷の表現）
          const g = ctx.createLinearGradient(topX0, 0, topX1, 0);
          g.addColorStop(0.0, theme.shadow);
          g.addColorStop(0.32, theme.highlight);
          g.addColorStop(0.65, theme.base);
          g.addColorStop(1.0, theme.shadow);

          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(topX0, curtainTop);
          ctx.lineTo(topX1 + 0.6, curtainTop); // 隙間防止のわずかなオーバーラップ
          // 曲線で自然な布のたわみを表現
          ctx.quadraticCurveTo(
            (topX1 + botX1) * 0.5 + swayFactor1 * 0.15,
            curtainTop + curtainH * 0.55,
            botX1 + 0.6,
            curtainBottom
          );
          ctx.lineTo(botX0, curtainBottom);
          ctx.quadraticCurveTo(
            (topX0 + botX0) * 0.5 + swayFactor0 * 0.15,
            curtainTop + curtainH * 0.55,
            topX0,
            curtainTop
          );
          ctx.closePath();
          ctx.fill();
        }

        // 先頭エッジのアクセントライン（引き手側の縁取り）
        const leadBotX = edgeX + state.hemSway * 55;
        ctx.strokeStyle = theme.trim;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(edgeX, curtainTop);
        ctx.quadraticCurveTo(
          (edgeX + leadBotX) * 0.5 + state.hemSway * 8,
          curtainTop + curtainH * 0.55,
          leadBotX,
          curtainBottom
        );
        ctx.stroke();

        ctx.restore();
      }

      /**
       * 上部のカーテンレールと滑車ランナーを描画
       */
      function drawCurtainRailAndRunners(layout, edgeX) {
        const { winLeft, winRight, railY } = layout;
        const railLeft = winLeft - 14;
        const railRight = winRight + 14;

        ctx.save();

        // レールバー本体
        const railGrad = ctx.createLinearGradient(0, railY - 4, 0, railY + 4);
        railGrad.addColorStop(0, '#E4E4E7');
        railGrad.addColorStop(0.5, '#A1A1AA');
        railGrad.addColorStop(1, '#52525B');
        ctx.fillStyle = railGrad;
        ctx.beginPath();
        ctx.roundRect(railLeft, railY - 3.5, railRight - railLeft, 7, 3.5);
        ctx.fill();

        // 左右の装飾キャップ（フィニアル）
        ctx.fillStyle = '#D4D4D8';
        ctx.beginPath();
        ctx.arc(railLeft, railY, 6, 0, Math.PI * 2);
        ctx.arc(railRight, railY, 6, 0, Math.PI * 2);
        ctx.fill();

        // ランナー（滑車リング）をプリーツ間隔に合わせて描画
        const curtainLeft = winLeft - 6;
        const numRunners = 12;
        for (let i = 0; i <= numRunners; i++) {
          const rx = curtainLeft + (edgeX - curtainLeft) * (i / numRunners);
          // リング
          ctx.strokeStyle = i === numRunners ? '#F59E0B' : '#E4E4E7';
          ctx.lineWidth = i === numRunners ? 2.5 : 1.8;
          ctx.beginPath();
          ctx.arc(rx, railY + 2, 4, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      // メインアニメーションループ
      function mainLoop(timestamp) {
        const dt = Math.min(0.05, (timestamp - state.lastTime) / 1000 || 0.016);
        state.lastTime = timestamp;

        updatePhysics(dt);
        renderScene();

        requestAnimationFrame(mainLoop);
      }

      // ==========================================
      // 7. ボタン・モード切替イベント
      // ==========================================
      ui.nextRoundBtn.addEventListener('click', () => {
        if (state.mode === 'challenge' && state.round >= state.maxRounds) {
          showOverallChallengeResult();
        } else {
          state.round += 1;
          resetRound(false);
        }
      });

      ui.restartAllBtn.addEventListener('click', () => {
        resetRound(true);
      });

      ui.modeChallengeBtn.addEventListener('click', () => {
        if (state.mode === 'challenge') return;
        state.mode = 'challenge';
        ui.modeChallengeBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg bg-amber-500 text-zinc-950 font-extrabold shadow-sm transition-all';
        ui.modeEndlessBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition-all';
        resetRound(true);
      });

      ui.modeEndlessBtn.addEventListener('click', () => {
        if (state.mode === 'endless') return;
        state.mode = 'endless';
        ui.modeEndlessBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg bg-amber-500 text-zinc-950 font-extrabold shadow-sm transition-all';
        ui.modeChallengeBtn.className = 'flex-1 sm:flex-initial px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition-all';
        resetRound(true);
      });

      function handleMuteToggle() {
        const isMuted = audio.toggleMute();
        document.querySelectorAll('.sound-icon-on').forEach(el => el.classList.toggle('hidden', isMuted));
        document.querySelectorAll('.sound-icon-off').forEach(el => el.classList.toggle('hidden', !isMuted));
      }

      ui.muteBtnMobile.addEventListener('click', handleMuteToggle);
      ui.muteBtnDesktop.addEventListener('click', handleMuteToggle);

      // 起動
      window.addEventListener('load', () => {
        resizeCanvas();
        resetRound(true);
        requestAnimationFrame(mainLoop);
      });
    })();
  </script>
</body>
</html>
